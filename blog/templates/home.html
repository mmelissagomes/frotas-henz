{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Frotas - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #454486, #198a3c, #000000);
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('{% static "images/caminhao_azul_escuro.jpg" %}') center/cover no-repeat;
      opacity: 0.07;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: url('{% static "images/logo.png" %}') no-repeat center center;
      background-size: 280px;
      opacity: 0.03;
      z-index: 0;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 160px;
      z-index: 2;
      filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.4));
      animation: fadeInLeft 1.2s ease;
    }

    .container {
      text-align: center;
      max-width: 400px;
      padding: 30px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      animation: fadeInUp 1s ease-in-out;
      z-index: 1;
    }

    .container h1 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .button {
      display: block;
      background-color: #198a3c;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      margin: 12px 0;
      border-radius: 6px;
      font-weight: bold;
      box-shadow: 0 0 6px #198a3c;
      transition: all 0.3s ease;
    }

    .button:hover {
      background-color: #145e28;
      box-shadow: 0 0 10px #198a3c;
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container {
        width: 90%;
        padding: 20px;
      }

      .logo {
        width: 120px;
      }

      body::after {
        background-size: 200px;
      }
    }
  </style>
</head>
<body>
  <img src="{% static 'images/logo.png' %}" alt="Logo da Empresa" class="logo">

  <div class="container">
    <h1>Sistema de Controle de Frotas</h1>
    <a href="/veiculos/" class="button">Veículos</a>
    <a href="/funcionarios/" class="button">Funcionários</a>
    <a href="/relatorios/" class="button">Relatórios</a>
  </div>
</body>
</html>
