{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Controle de Frotas - Home</title>
    <style>
        body {
            background-color: #e6f0fa;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 140px;
            animation: fadeInLeft 1s ease-in-out;
        }

        .container {
            text-align: center;
            max-width: 400px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            animation: fadeInUp 0.8s ease-in-out;
        }

        .container h1 {
            font-size: 22px;
            color: #003366;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            background-color: #28a745;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #218838;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            .logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <img src="{% static 'images/logo.png' %}" alt="Logo da Empresa" class="logo">

    <div class="container">
        <h1>Sistema de Controle de Frotas</h1>
        <a href="/veiculos/" class="button">Veículos</a>
        <a href="/funcionarios/" class="button">Funcionários</a>
        <a href="/relatorios/" class="button">Relatórios</a>
    </div>
</body>
</html>
