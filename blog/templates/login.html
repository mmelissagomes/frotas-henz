{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Controle de Frotas - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e6f0fa; /* Azul claro */
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 20px 30px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header img {
            width: 160px;
            animation: fadeInLeft 1s ease-in-out;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
            animation: fadeInUp 1s ease-in-out;
        }

        h2 {
            margin-bottom: 20px;
            color: #003366; /* Azul escuro */
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #28a745; /* Verde vibrante */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #218838; /* Verde escuro */
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-box {
                width: 90%;
                padding: 20px;
            }

            .header img {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{% static 'images/logo.png' %}" alt="Logo da Empresa">
    </div>

    <div class="container">
        <div class="login-box">
            <h2>Acesso ao Sistema de Controle de Frotas</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
