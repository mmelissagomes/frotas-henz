{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Frotas - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #454486, #198a3c, #000000);
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('{% static "images/caminhao_azul_escuro.jpg" %}') center/cover no-repeat;
      opacity: 0.08;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: url('{% static "images/logo.png" %}') no-repeat center center;
      background-size: 280px;
      opacity: 0.04;
      z-index: 0;
    }

    .top-logo {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 2;
    }

    .top-logo img {
      width: 160px;
      filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.4));
      animation: floatIn 1.5s ease;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      z-index: 1;
      position: relative;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 40px;
      width: 350px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: fadeInUp 1s ease;
    }

    h2 {
      margin-bottom: 20px;
      color: #ffffff;
      font-weight: 600;
    }

    label {
      color: #ffffff;
      font-size: 14px;
      text-align: left;
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    button {
      background-color: #198a3c;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 6px #198a3c;
    }

    button:hover {
      background-color: #145e28;
      box-shadow: 0 0 10px #198a3c;
    }

    p {
      color: #ff4d4d;
      font-weight: 500;
      margin-top: 10px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .login-box { width: 90%; padding: 30px; }
      .top-logo img { width: 120px; }
      body::after { background-size: 200px; }
    }
  </style>
</head>
<body>

  <!-- Logo no canto superior -->
  <div class="top-logo">
    <img src="{% static 'images/logo.png' %}" alt="Logo da Empresa">
  </div>

  <!-- Caixa de Login -->
  <div class="container">
    <div class="login-box">
      <h2>Controle de Frotas</h2>
      {% if erro %}
        <p>{{ erro }}</p>
      {% endif %}
      <form method="POST">
        {% csrf_token %}
        <label>Usuário:</label>
        <input type="text" name="usuario">
        <label>Senha:</label>
        <input type="password" name="senha">
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

</body>
</html>
